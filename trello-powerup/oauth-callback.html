<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkLoom OAuth Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 400px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }
        
        h1 {
            margin-bottom: 16px;
            font-size: 24px;
        }
        
        p {
            margin-bottom: 20px;
            opacity: 0.9;
            line-height: 1.5;
        }
        
        .status {
            padding: 16px;
            border-radius: 12px;
            margin: 20px 0;
            font-weight: 600;
        }
        
        .status.success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid rgba(40, 167, 69, 0.3);
        }
        
        .status.error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">L</div>
        <h1>LinkLoom OAuth</h1>
        
        <div id="loading" class="status success">
            <div class="spinner"></div>
            <p>Completing Trello authorization...</p>
        </div>
        
        <div id="success" class="status success" style="display: none;">
            <p>✅ Authorization successful!</p>
            <p>You can now close this window and return to Trello.</p>
        </div>
        
        <div id="error" class="status error" style="display: none;">
            <p>❌ Authorization failed</p>
            <p id="errorMessage"></p>
        </div>
    </div>

    <script>
        // Handle OAuth callback
        async function handleOAuthCallback() {
            try {
                // Get token from URL hash
                const hash = window.location.hash.substring(1);
                const params = new URLSearchParams(hash);
                const token = params.get('token');
                
                if (token) {
                    // Success - send token back to parent window
                    if (window.opener) {
                        window.opener.postMessage({
                            type: 'trello-oauth-success',
                            token: token
                        }, '*');
                        
                        // Show success message
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('success').style.display = 'block';
                        
                        // Auto-close after 3 seconds
                        setTimeout(() => {
                            window.close();
                        }, 3000);
                    } else {
                        throw new Error('No parent window found');
                    }
                } else {
                    // Check for error
                    const error = params.get('error');
                    if (error) {
                        throw new Error(`OAuth error: ${error}`);
                    } else {
                        throw new Error('No token received from Trello');
                    }
                }
                
            } catch (error) {
                console.error('OAuth callback error:', error);
                
                // Show error message
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('errorMessage').textContent = error.message;
                
                // Send error to parent window
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'trello-oauth-error',
                        error: error.message
                    }, '*');
                }
            }
        }
        
        // Handle page load
        document.addEventListener('DOMContentLoaded', function() {
            handleOAuthCallback();
        });
    </script>
</body>
</html>
