<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LinkLoom Test Popup</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f8f9fa;
        color: #333;
        text-align: center;
      }
      
      .container {
        max-width: 400px;
        margin: 0 auto;
      }
      
      .logo {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        color: white;
        font-size: 24px;
        font-weight: bold;
      }
      
      .title {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #1a1a1a;
      }
      
      .subtitle {
        color: #666;
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 30px;
      }
      
      .btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      
      .btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">L</div>
      <div class="title">LinkLoom Test</div>
      <div class="subtitle">This is a simple test popup to verify the Power-Up is working.</div>
      
      <button class="btn" onclick="closeTest()">
        Close Test
      </button>
    </div>

    <script>
      console.log('Test popup loaded successfully!');
      
      function closeTest() {
        console.log('Close test button clicked!');
        try {
          if (window.close) {
            window.close();
          } else {
            document.body.innerHTML = '<div style="text-align: center; padding: 40px;"><h2>Test Complete!</h2><p>You can close this window manually.</p></div>';
          }
        } catch (error) {
          console.error('Error closing test popup:', error);
          document.body.innerHTML = '<div style="text-align: center; padding: 40px;"><h2>Test Complete!</h2><p>You can close this window manually.</p></div>';
        }
      }
    </script>
  </body>
</html>
