<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Connect LinkLoom</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script src="./config.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        color: #333;
        min-height: 100vh;
      }
      
      .container {
        max-width: 300px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      
      .header {
        text-align: center;
        margin-bottom: 16px;
        padding: 16px 14px 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        position: relative;
      }
      

      
      .logo {
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 10px;
        color: white;
        font-size: 18px;
        font-weight: bold;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }
      
      .title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 5px;
        color: white;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }
      
      .subtitle {
        color: rgba(255, 255, 255, 0.9);
        font-size: 12px;
        line-height: 1.3;
        font-weight: 400;
      }
      
      .form-group {
        margin-bottom: 12px;
        padding: 0 14px;
      }
      
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #2d3748;
        font-size: 12px;
        letter-spacing: 0.025em;
      }
      
      .form-group label.required::after {
        content: ' *';
        color: #e53e3e;
        font-weight: 700;
      }
      
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 8px;
        border: 2px solid #e2e8f0;
        border-radius: 6px;
        font-size: 12px;
        transition: all 0.3s ease;
        box-sizing: border-box;
        background: #f8fafc;
        color: #2d3748;
        font-weight: 500;
      }
      
      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        transform: translateY(-1px);
      }
      
      .btn {
        width: 100%;
        padding: 8px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 2px 6px rgba(102, 126, 234, 0.2);
        position: relative;
        overflow: hidden;
      }
      
      .btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
      }
      
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      }
      
      .btn:hover::before {
        left: 100%;
      }
      
      .btn:active {
        transform: translateY(0);
      }
      
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
      }
      
            /* Button container spacing */
      .btn-container {
        padding: 0 14px 14px;
      }
      
      .status {
        padding: 8px;
        border-radius: 6px;
        margin: 10px 14px;
        text-align: center;
        font-weight: 600;
        font-size: 12px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
        border: none;
      }
      


      .status.success {
        background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
        color: #155724;
        border-left: 4px solid #28a745;
      }

      .status.error {
        background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
        color: #721c24;
        border-left: 4px solid #dc3545;
      }

      .status.loading {
        background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
        color: #0c5460;
        border-left: 4px solid #17a2b8;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">L</div>
        <div class="title">Connect LinkLoom</div>
        <div class="subtitle">Automatically sync your Trello content to your bio page</div>
      </div>

      <!-- Connection Form -->
      <div id="connectionForm">
        <div class="form-group">
          <label for="linkloomUrl" class="required">LinkLoom URL</label>
          <input 
            type="url" 
            id="linkloomUrl" 
            placeholder="https://yourname.linkloom.com"
            value="https://fadi.linklom.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="syncList" class="required">Sync List</label>
          <select id="syncList" required>
            <option value="">Select a list to sync...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="syncRule" class="required">Sync Rule</label>
          <select id="syncRule" required>
            <option value="latest">Latest cards</option>
            <option value="pinned">Pinned cards only</option>
            <option value="all">All cards</option>
          </select>
        </div>

        <div class="form-group">
          <label for="cardLimit" class="required">Card Limit</label>
          <input 
            type="number" 
            id="cardLimit" 
            min="1" 
            max="50" 
            value="10"
            required
          />
        </div>

        <div class="btn-container">
          <button class="btn" id="connectBtn" onclick="connectToLinkLoom()">
            Connect LinkLoom
          </button>
        </div>
      </div>

      <!-- Status Messages -->
      <div id="status" class="status hidden"></div>

      <!-- Connection Success - Removed, now goes directly to Already Connected view -->

      <!-- Already Connected -->
      <div id="alreadyConnected" class="hidden">
        <div class="status success">
          🔗 Already Connected
        </div>
        <p style="text-align: center; margin: 16px 0; font-size: 14px; color: #666;">
          This board is already connected to LinkLoom!
        </p>
        <div id="connectionDetails" style="text-align: left; background: #f8f9fa; padding: 12px; border-radius: 6px; margin: 12px 14px; border: 1px solid #e9ecef;">
          <p style="margin: 0; color: #666; font-size: 12px;">
            <strong>Connection Details:</strong><br>
            <span id="connectionInfo">Loading...</span>
          </p>
        </div>
        
        <!-- Multiple List Management -->
        <div id="listManagement" style="padding: 0 14px; margin-bottom: 15px;">
          <h4 style="margin: 10px 0; color: #333; font-size: 14px;">📋 List Management</h4>
          <div id="listConnections" style="margin: 10px 0;">
            <!-- List connections will be populated here -->
          </div>
          <button class="btn" onclick="addListConnection()" style="width: 100%; background: #17a2b8; margin-bottom: 10px;">
            ➕ Add Another List
          </button>
        </div>
        
        <div style="padding: 0 14px 14px;">
          <button class="btn" onclick="syncAgain()" style="width: 100%; background: #28a745; margin-bottom: 10px;">
            🔄 Sync Now
          </button>
          <button class="btn" onclick="disconnectAndReconnect()" style="width: 100%; background: #dc3545;">
            Disconnect & Reconnect
          </button>
        </div>
      </div>
    </div>

    <script>
      // Trello API configuration from config file
      console.log('🔧 Loading config:', window.LINKLOOM_CONFIG);
      const TRELLO_API_KEY = window.LINKLOOM_CONFIG?.TRELLO_API_KEY || 'your-actual-trello-api-key-here';
      
      console.log('🔑 Trello API Key loaded:', TRELLO_API_KEY ? 'YES' : 'NO', TRELLO_API_KEY ? TRELLO_API_KEY.substring(0, 10) + '...' : 'NO KEY');
      
      // Check if API key is configured
      if (TRELLO_API_KEY === 'your-actual-trello-api-key-here') {
        console.error('⚠️ Please update your Trello API key in config.js');
      }
      
      let trelloClient;
      let currentBoard;
      let currentList;
      let workingLists = [
        { id: 'todo', name: 'To Do', closed: false },
        { id: 'doing', name: 'Doing', closed: false },
        { id: 'done', name: 'Done', closed: false },
        { id: 'linkloom', name: 'LinkLoom', closed: false },
        { id: 'backlog', name: 'Backlog', closed: false },
        { id: 'in-progress', name: 'In Progress', closed: false }
      ];

      // Initialize when page loads
      document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 DOM loaded, initializing Power-Up...');
        console.log('🔍 Checking localStorage on load:');
        console.log('🔍 linkloom-connection:', localStorage.getItem('linkloom-connection'));
        console.log('🔍 current-trello-board-id:', localStorage.getItem('current-trello-board-id'));
        console.log('🔍 trello-real-data:', localStorage.getItem('trello-real-data'));
        
        // Small delay to ensure localStorage data is available
        setTimeout(() => {
          initializePowerUp();
        }, 100);
      });

      function initializePowerUp() {
        console.log('🔧 Initializing Power-Up...');
        
        // FIRST PRIORITY: Check if we have an existing connection
        const connectionData = localStorage.getItem('linkloom-connection');
        console.log('🔍 FIRST PRIORITY - Checking existing connection:', connectionData);
        
        if (connectionData) {
          try {
            const connection = JSON.parse(connectionData);
            console.log('✅ EXISTING CONNECTION FOUND! Showing already connected view...');
            
            // Set current board
            currentBoard = { 
              id: connection.boardId, 
              name: connection.boardName || 'Your Trello Board' 
            };
            
            // Show already connected view immediately
            showAlreadyConnected();
            return;
          } catch (error) {
            console.log('❌ Error parsing connection data:', error);
          }
        }
        
        // SECOND PRIORITY: Listen for real Trello data from connector
        window.addEventListener('message', function(event) {
          console.log('📨 Message received:', event.data);
          if (event.data && event.data.type === 'trello-data') {
            console.log('✅ Real Trello data received via postMessage');
            console.log('🔧 Initializing with real Trello data...');
            
            const { boardId, boardName, realLists } = event.data.data;
            console.log('🏢 Real board data received:', { boardId, boardName });
            console.log('📋 Real lists data received:', realLists);
            
            // Initialize with real data
            initializeWithRealData(boardId, boardName, realLists);
          }
        });
        
        // THIRD PRIORITY: Check if we have real Trello data from localStorage
        try {
          const storedData = localStorage.getItem('trello-real-data');
          console.log('🔍 THIRD PRIORITY - Checking trello-real-data:', storedData);
          
          if (storedData) {
            const realData = JSON.parse(storedData);
            const { boardId, boardName, realLists } = realData;
            
            if (boardId && boardName && realLists) {
              console.log('✅ Real Trello data detected from localStorage');
              console.log('🔧 Initializing with real Trello data...');
              
              // Initialize with real data
              initializeWithRealData(boardId, boardName, realLists);
              
              // Clear localStorage after using it
              localStorage.removeItem('trello-real-data');
              return;
            }
          }
        } catch (error) {
          console.log('❌ Error reading localStorage:', error);
        }
        
        // FOURTH PRIORITY: Check URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const boardId = urlParams.get('boardId');
        const boardName = urlParams.get('boardName');
        const realListsParam = urlParams.get('realLists');
        
        if (boardId && boardName && realListsParam) {
          console.log('✅ Real Trello data detected in URL');
          try {
            const realLists = JSON.parse(decodeURIComponent(realListsParam));
            initializeWithRealData(boardId, boardName, realLists);
            return;
          } catch (error) {
            console.error('❌ Error parsing real data:', error);
          }
        }
        
        // LAST RESORT: Load fallback data
        console.log('🔄 No data found, loading fallback data...');
        loadBoardDataWithFallback();
      }

      async function fetchRealTrelloData() {
        try {
          console.log('🏢 Fetching real Trello data via API...');
          
          // Try to get board context from parent window or URL
          let boardId = null;
          let boardName = null;
          
          // Check if we're in a Trello context and can get board info
          if (window.parent && window.parent.location.href.includes('trello.com')) {
            console.log('🔍 In Trello context, attempting to extract board info...');
            
            // Try to get board ID from the URL
            const trelloUrl = window.parent.location.href;
            const boardMatch = trelloUrl.match(/\/b\/([a-zA-Z0-9]+)/);
            
            if (boardMatch) {
              boardId = boardMatch[1];
              console.log('✅ Found board ID from URL:', boardId);
              
              // Now fetch real lists using Trello API
              await fetchRealListsFromAPI(boardId);
              return;
            }
          }
          
          // If we can't get board context, use fallback
          console.log('🔄 Could not determine board context, using fallback data...');
          loadBoardDataWithFallback();
          
        } catch (error) {
          console.error('❌ Error fetching real Trello data:', error);
          console.log('🔄 Falling back to fallback data');
          loadBoardDataWithFallback();
        }
      }
      
      async function fetchRealListsFromAPI(boardId) {
        try {
          console.log('📡 Fetching real lists from Trello API for board:', boardId);
          
          // Use Trello API to get lists
          const response = await fetch(`https://api.trello.com/1/boards/${boardId}/lists?key=${TRELLO_API_KEY}&token=${getTrelloToken()}`);
          
          if (!response.ok) {
            throw new Error(`Trello API error: ${response.status}`);
          }
          
          const lists = await response.json();
          console.log('✅ Real lists fetched from API:', lists);
          
          // Process real lists
          workingLists = lists
            .filter(list => !list.closed)
            .map(list => ({
              id: list.id,
              name: list.name,
              closed: list.closed
            }));
          
          console.log('📋 Processed real lists:', workingLists);
          
          // Set current board
          currentBoard = { id: boardId, name: 'Your Trello Board' };
          
          // Populate dropdown with real lists
          populateListDropdown(workingLists);
          showStatus('Connected to real Trello board!', 'success');
          
        } catch (error) {
          console.error('❌ Error fetching lists from API:', error);
          console.log('🔄 Falling back to fallback data');
          loadBoardDataWithFallback();
        }
      }
      
      function getTrelloToken() {
        // Try to get token from localStorage or prompt user
        const token = localStorage.getItem('trello_token');
        if (token) {
          return token;
        }
        
        // If no token, prompt user to enter it
        const userToken = prompt('Please enter your Trello token to fetch real lists:');
        if (userToken) {
          localStorage.setItem('trello_token', userToken);
          return userToken;
        }
        
        return null;
      }

      function initializeWithRealData(boardId, boardName, realLists) {
        console.log('🔧 Initializing with real Trello data...');
        currentBoard = { id: boardId, name: boardName };
        workingLists = realLists;
        populateListDropdown(workingLists);
        showStatus('Connected to real Trello board!', 'success');
      }
      
      function loadBoardDataWithFallback() {
        console.log('🔄 Using fallback board data');
        currentBoard = { id: 'working-board', name: 'Main LinkLoom' };
        workingLists = [
          { id: 'todo', name: 'To Do', closed: false },
          { id: 'doing', name: 'In Progress', closed: false },
          { id: 'done', name: 'Done', closed: false },
          { id: 'backlog', name: 'Backlog', closed: false },
          { id: 'review', name: 'Review', closed: false },
          { id: 'testing', name: 'Testing', closed: false }
        ];
        
        populateListDropdown(workingLists);
        showStatus('Using fallback data - ready to connect', 'success');
      }

      async function checkConnectionStatus() {
        try {
          // Check if we have a connection stored locally
          const connectionData = localStorage.getItem('linkloom-connection');
          if (connectionData) {
            const connection = JSON.parse(connectionData);
            console.log('Found existing connection:', connection);
            return true;
          }
          
          console.log('No existing connection found');
          return false;
        } catch (error) {
          console.log('Error checking connection status:', error);
          return false;
        }
      }

      function populateListDropdown(lists) {
        console.log('Populating dropdown with lists:', lists);
        const select = document.getElementById('syncList');
        select.innerHTML = '<option value="">Select a list to sync...</option>';
        
        if (lists && lists.length > 0) {
          lists.forEach(list => {
            console.log('Processing list:', list);
            if (!list.closed) {
              const option = document.createElement('option');
              option.value = list.id;
              option.textContent = list.name;
              select.appendChild(option);
              console.log('Added option:', list.name);
            }
          });
        } else {
          console.log('No lists found or lists is empty');
          // Add a fallback option
          const option = document.createElement('option');
          option.value = 'fallback';
          option.textContent = 'No lists available';
          select.appendChild(option);
        }
        
        console.log('Final dropdown options:', Array.from(select.options).map(opt => ({ value: opt.value, text: opt.textContent })));
      }

      async function syncAgain() {
        // Declare originalText outside try block so it's available in finally
        let originalText = '🔄 Sync Now';
        
        try {
          console.log('🔄 Starting re-sync...');
          
          // Get current connection data
          const connectionData = localStorage.getItem('linkloom-connection');
          if (!connectionData) {
            showStatus('No connection found. Please connect first.', 'error');
            return;
          }
          
          const connection = JSON.parse(connectionData);
          console.log('🔄 Re-syncing with connection:', connection);
          
          // Show loading state
          const syncBtn = document.querySelector('button[onclick="syncAgain()"]');
          if (syncBtn) {
            originalText = syncBtn.innerHTML;
            syncBtn.innerHTML = '🔄 Syncing...';
            syncBtn.disabled = true;
          }
          
          // Sync all active list connections
          let totalCardsSynced = 0;
          let totalListsSynced = 0;
          
          for (const listConnection of connection.listConnections || []) {
            if (listConnection.isActive) {
              console.log(`🔄 Syncing list: ${listConnection.listName} (${listConnection.listId})`);
              
              // Send sync request for this specific list
              const response = await fetch(`${window.LINKLOOM_CONFIG.SUPABASE_URL}/functions/v1/trello-sync-ultimate-test`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${window.LINKLOOM_CONFIG.SUPABASE_ANON_KEY}`
                },
                body: JSON.stringify({
                  user_id: connection.user_id || 'test-user',
                  board_id: currentBoard.id,
                  list_id: listConnection.listId,
                  sync_rule: connection.syncRule || 'latest',
                  board_name: currentBoard.name,
                  list_name: listConnection.listName,
                  linkloom_url: connection.linkloomUrl,
                  card_limit: connection.cardLimit || 10,
                  trello_token: connection.trelloToken,
                  trello_api_key: window.LINKLOOM_CONFIG.TRELLO_API_KEY
                })
              });
              
              if (!response.ok) {
                const errorData = await response.json();
                console.log('🔍 Detailed error response:', errorData);
                
                // Build detailed error message
                let errorMessage = `Sync failed for list ${listConnection.listName}: ${response.status} - ${errorData.error || 'Unknown error'}`;
                
                if (errorData.trello_error) {
                  errorMessage += `\nTrello Error: ${errorData.trello_error}`;
                }
                if (errorData.status) {
                  errorMessage += `\nStatus: ${errorData.status}`;
                }
                if (errorData.list_id) {
                  errorMessage += `\nList ID: ${errorData.list_id}`;
                }
                if (errorData.trello_url) {
                  errorMessage += `\nTrello URL: ${errorData.trello_url}`;
                }
                
                throw new Error(errorMessage);
              }
              
              const result = await response.json();
              console.log(`✅ List ${listConnection.listName} synced:`, result);
              
              totalCardsSynced += result.trello_cards_count || 0;
              totalListsSynced++;
            }
          }
          
          if (totalListsSynced === 0) {
            throw new Error('No active list connections found to sync');
          }
          
          // Show success message for multiple lists
          showStatus(`✅ Re-sync successful! ${totalCardsSynced} cards synced from ${totalListsSynced} lists.`, 'success');
          
          // Update connection details
          updateConnectionDetails();
          
        } catch (error) {
          console.error('❌ Re-sync failed:', error);
          showStatus(`❌ Re-sync failed: ${error.message}`, 'error');
        } finally {
          // Restore button state
          const syncBtn = document.querySelector('button[onclick="syncAgain()"]');
          if (syncBtn) {
            syncBtn.innerHTML = originalText;
            syncBtn.disabled = false;
          } else {
            console.log('⚠️ Sync button not found for restoration');
          }
        }
      }
      
      async function connectToLinkLoom() {
        try {
          const linkloomUrl = document.getElementById('linkloomUrl').value;
          const listId = document.getElementById('syncList').value;
          const syncRule = document.getElementById('syncRule').value;
          const cardLimit = document.getElementById('cardLimit').value;

          if (!linkloomUrl || !listId) {
            showStatus('Please fill in all required fields', 'error');
            return;
          }

          showStatus('Initiating Trello OAuth...', 'loading');
          
          // Get list details from our working lists
          const selectedList = workingLists.find(list => list.id === listId);
          if (!selectedList) {
            throw new Error('Selected list not found');
          }
          currentList = { id: listId, name: selectedList.name };
          
          // Prepare connection data for after OAuth
          const connectionData = {
            boardId: currentBoard.id,
            boardName: currentBoard.name,
            listConnections: [], // Array to store multiple list connections
            linkloomUrl: linkloomUrl,
            syncRule: syncRule,
            cardLimit: parseInt(cardLimit),
            connectedAt: new Date().toISOString()
          };
          
          // Add the first list connection
          connectionData.listConnections.push({
            listId: listId,
            listName: currentList.name,
            isActive: true
          });
          
          console.log('🔗 Connection data prepared:', {
            boardId: connectionData.boardId,
            boardName: connectionData.boardName,
            listConnections: connectionData.listConnections
          });

          // Store connection data locally
          localStorage.setItem('linkloom-connection', JSON.stringify(connectionData));
          
          // Initiate OAuth flow
          await initiateTrelloOAuth(connectionData);
          
        } catch (error) {
          console.error('Error connecting to LinkLoom:', error);
          showStatus('Error connecting: ' + error.message, 'error');
        }
      }
      
      async function initiateTrelloOAuth(connectionData) {
        try {
          // Trello OAuth URL - use the Power-Up's domain for callback
          const oauthUrl = `https://trello.com/1/authorize?expiration=never&name=LinkLoom&scope=read&response_type=token&key=${TRELLO_API_KEY}&return_url=${encodeURIComponent('https://dapper-eclair-8ecd0e.netlify.app/oauth-callback.html')}`;
          
          console.log('🔗 OAuth URL:', oauthUrl);
          
          // Open OAuth popup
          const oauthWindow = window.open(oauthUrl, 'trello-oauth', 'width=500,height=600');
          
          if (!oauthWindow) {
            throw new Error('Failed to open OAuth popup. Please allow popups for this site.');
          }
          
          console.log('🪟 OAuth popup opened successfully');
          
          // Listen for OAuth completion
          window.addEventListener('message', async function(event) {
            if (event.data && event.data.type === 'trello-oauth-success') {
              const { token } = event.data;
              
              console.log('🎯 OAuth success - Token received:', token ? 'YES' : 'NO', token ? token.substring(0, 10) + '...' : 'NO TOKEN');
              
              // Store token with connection data
              connectionData.trelloToken = token;
              console.log('🔐 Token stored in connectionData:', connectionData.trelloToken ? 'YES' : 'NO');
              
              localStorage.setItem('linkloom-connection', JSON.stringify(connectionData));
              
              // Close OAuth window
              if (oauthWindow) oauthWindow.close();
              
              // Now send to LinkLoom backend with token
              try {
                console.log('📤 About to send to backend with token:', connectionData.trelloToken ? 'YES' : 'NO');
                await sendToLinkLoom(connectionData);
                showConnectionSuccess();
              } catch (error) {
                console.error('Backend sync failed:', error);
                showStatus('OAuth successful, but backend sync failed. Check your Supabase setup.', 'error');
                setTimeout(() => showConnectionSuccess(), 3000);
              }
            }
          });
          
        } catch (error) {
          console.error('OAuth error:', error);
          showStatus('OAuth failed: ' + error.message, 'error');
        }
      }

      async function sendToLinkLoom(connectionData) {
        try {
          // CRITICAL DEBUG: Check if config is loaded
          console.log('🚨 CRITICAL DEBUG - LINKLOOM_CONFIG loaded:', !!window.LINKLOOM_CONFIG);
          console.log('🚨 CRITICAL DEBUG - Full config object:', window.LINKLOOM_CONFIG);
          
          console.log('📤 Sending data to LinkLoom backend:', connectionData);
          console.log('🔑 Trello token present:', connectionData.trelloToken ? 'YES' : 'NO');
          console.log('🔑 Token value:', connectionData.trelloToken ? connectionData.trelloToken.substring(0, 20) + '...' : 'NO TOKEN');
          
          const requestBody = {
            user_id: 'test-user', // We'll need to get this from the user's session
            board_id: connectionData.boardId,
            list_id: connectionData.listId,
            sync_rule: connectionData.syncRule,
            board_name: connectionData.boardName,
            list_name: connectionData.listName,
            linkloom_url: connectionData.linkloomUrl,
            card_limit: connectionData.cardLimit,
            trello_token: connectionData.trelloToken,
            trello_api_key: window.LINKLOOM_CONFIG.TRELLO_API_KEY
          };
          
          console.log('📋 Request body being sent:', requestBody);
          console.log('🔑 Trello token in request:', requestBody.trello_token ? 'YES' : 'NO');
          
          // DEBUG: Check the config values
          console.log('🔍 DEBUG - SUPABASE_URL:', window.LINKLOOM_CONFIG.SUPABASE_URL);
          console.log('🔍 DEBUG - SUPABASE_ANON_KEY length:', window.LINKLOOM_CONFIG.SUPABASE_ANON_KEY?.length || 0);
          console.log('🔍 DEBUG - SUPABASE_ANON_KEY prefix:', window.LINKLOOM_CONFIG.SUPABASE_ANON_KEY?.substring(0, 20) + '...');
          console.log('🔍 DEBUG - Full request URL:', `${window.LINKLOOM_CONFIG.SUPABASE_URL}/functions/v1/trello-sync`);
          
          // DEBUG: Log the headers being sent
          const requestHeaders = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${window.LINKLOOM_CONFIG.SUPABASE_ANON_KEY}`
          };
          console.log('🔍 DEBUG - Request headers:', requestHeaders);
          
          // Call your Supabase Edge Function
          const response = await fetch(`${window.LINKLOOM_CONFIG.SUPABASE_URL}/functions/v1/trello-sync-ultimate-test`, {
            method: 'POST',
            headers: requestHeaders,
            body: JSON.stringify(requestBody)
          });

          if (!response.ok) {
            const errorText = await response.text();
            console.error('Supabase response error:', response.status, errorText);
            throw new Error(`Failed to sync with LinkLoom: ${response.status} - ${errorText}`);
          }

          const result = await response.json();
          console.log('Backend sync successful:', result);
          return result;
        } catch (error) {
          console.error('Error syncing with LinkLoom:', error);
          throw error;
        }
      }

      function showStatus(message, type) {
        const status = document.getElementById('status');
        status.textContent = message;
        status.className = `status ${type}`;
        status.classList.remove('hidden');
      }
      
      function updateConnectionDetails() {
        const connectionData = localStorage.getItem('linkloom-connection');
        if (connectionData) {
          const connection = JSON.parse(connectionData);
          const connectionInfo = document.getElementById('connectionInfo');
          if (connectionInfo) {
            // Handle both old single-list and new multiple-list formats
            const listConnections = connection.listConnections || [];
            const isMultipleLists = listConnections.length > 0;
            
            let listsHtml = '';
            if (isMultipleLists) {
              listsHtml = `
                • Lists: ${listConnections.map(conn => `${conn.listName}${conn.isActive ? ' (Active)' : ' (Inactive)'}`).join(', ')}<br>
              `;
            } else {
              // Fallback for old single-list format
              listsHtml = `• List: ${connection.listName}<br>`;
            }
            
            connectionInfo.innerHTML = `
              • Board: ${connection.boardName || currentBoard?.name}<br>
              ${listsHtml}
              • Sync Rule: ${connection.syncRule}<br>
              • Last Synced: ${new Date().toLocaleString()}<br>
              • Card Limit: ${connection.cardLimit || 10}
            `;
          }
        }
      }
      
      // REMOVED: checkExistingConnection function - no longer needed
      // Connection checking is now done directly in initializePowerUp
      
      async function getCurrentBoardId() {
        try {
          // First priority: try to get from current-trello-board-id (most reliable)
          const currentBoardId = localStorage.getItem('current-trello-board-id');
          if (currentBoardId) {
            console.log('🔍 Got board ID from current-trello-board-id:', currentBoardId);
            return currentBoardId;
          }
          
          // Second priority: try to get from localStorage trello-real-data (fresh data from connector)
          const trelloData = localStorage.getItem('trello-real-data');
          if (trelloData) {
            try {
              const data = JSON.parse(trelloData);
              console.log('🔍 Got board ID from trello-real-data:', data.boardId);
              return data.boardId;
            } catch (e) {
              console.log('❌ Error parsing trello-real-data:', e);
            }
          }
          
          // Third priority: try to get from existing connection
          const connectionData = localStorage.getItem('linkloom-connection');
          if (connectionData) {
            try {
              const connection = JSON.parse(connectionData);
              console.log('🔍 Got board ID from existing connection:', connection.boardId);
              return connection.boardId;
            } catch (e) {
              console.log('❌ Error parsing connection data:', e);
            }
          }
          
          // Fourth priority: try to get from URL parameters
          const urlParams = new URLSearchParams(window.location.search);
          const boardIdFromUrl = urlParams.get('boardId');
          console.log('🔍 Got board ID from URL:', boardIdFromUrl);
          
          // Fifth priority: try to get from Trello context (usually not available in popup)
          if (typeof t !== 'undefined' && t.board) {
            try {
              const boardId = await t.board('id');
              console.log('🔍 Got board ID from t.board():', boardId);
              return boardId.id || boardId;
            } catch (e) {
              console.log('❌ Error getting board ID from t.board():', e);
            }
          }
          
          return boardIdFromUrl;
        } catch (error) {
          console.log('❌ Could not get board ID:', error);
          return null;
        }
      }
      
      async function fetchRealListsForBoard(boardId) {
        try {
          console.log('📡 Fetching real lists for board:', boardId);
          
          // Use Trello API to get lists
          const response = await fetch(`https://api.trello.com/1/boards/${boardId}/lists?key=${TRELLO_API_KEY}`);
          
          if (!response.ok) {
            throw new Error(`Trello API error: ${response.status}`);
          }
          
          const lists = await response.json();
          console.log('✅ Real lists fetched from API:', lists);
          
          // Process real lists
          workingLists = lists
            .filter(list => !list.closed)
            .map(list => ({
              id: list.id,
              name: list.name,
              closed: list.closed
            }));
          
          console.log('📋 Processed real lists:', workingLists);
          
          // Populate dropdown with real lists
          populateListDropdown(workingLists);
          
        } catch (error) {
          console.error('❌ Error fetching lists from API:', error);
          console.log('🔄 Falling back to fallback data');
          loadBoardDataWithFallback();
        }
      }

      function showConnectionSuccess() {
        // Store the current board ID for future reference
        if (currentBoard && currentBoard.id) {
          localStorage.setItem('current-trello-board-id', currentBoard.id);
          console.log('✅ Current board ID stored for future reference:', currentBoard.id);
        }
        
        // Instead of showing connection success, immediately show the already connected view
        document.getElementById('connectionForm').classList.add('hidden');
        document.getElementById('status').classList.add('hidden');
        showAlreadyConnected();
      }

      function showAlreadyConnected() {
        document.getElementById('connectionForm').classList.add('hidden');
        document.getElementById('status').classList.add('hidden');
        document.getElementById('alreadyConnected').classList.remove('hidden');
        
        // Show connection details
        updateConnectionDetails();
        
        // Populate list connections
        populateListConnections();
      }

      function disconnectAndReconnect() {
        try {
          // Remove connection data
          localStorage.removeItem('linkloom-connection');
          localStorage.removeItem('current-trello-board-id');
          console.log('Connection disconnected');
          
          // Show the connection form again
          document.getElementById('alreadyConnected').classList.add('hidden');
          document.getElementById('connectionForm').classList.remove('hidden');
          document.getElementById('status').classList.remove('hidden');
          
          // Reset form and reload lists
          document.getElementById('syncList').value = '';
          document.getElementById('linkloomUrl').value = 'https://fadi.linklom.com';
          document.getElementById('syncRule').value = 'latest';
          document.getElementById('cardLimit').value = '10';
          
          // Reload the lists dropdown
          console.log('Reloading lists dropdown with:', workingLists);
          populateListDropdown(workingLists);
          console.log('Lists dropdown populated');
          
          // Reset the currentBoard and currentList
          currentBoard = { id: 'working-board', name: 'Your Board' };
          currentList = null;
          
          showStatus('Ready to reconnect', 'success');
          
        } catch (error) {
          console.error('Error disconnecting:', error);
        }
      }

      // Multiple list management functions
      function populateListConnections() {
        const connection = JSON.parse(localStorage.getItem('linkloom-connection'));
        if (!connection) return;
        
        const listConnectionsContainer = document.getElementById('listConnections');
        if (!listConnectionsContainer) return;
        
        // Handle both old single-list and new multiple-list formats
        const listConnections = connection.listConnections || [];
        const isMultipleLists = listConnections.length > 0;
        
        if (isMultipleLists) {
          // Show multiple list connections
          listConnectionsContainer.innerHTML = listConnections.map(conn => `
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px; background: white; border: 1px solid #ddd; border-radius: 4px; margin: 5px 0;">
              <span style="font-size: 12px;">${conn.listName}</span>
              <div>
                <button onclick="toggleListConnection('${conn.listId}')" style="margin-right: 5px; padding: 4px 8px; font-size: 11px; border: none; border-radius: 3px; background: ${conn.isActive ? '#28a745' : '#6c757d'}; color: white;">
                  ${conn.isActive ? '🟢 Active' : '🔴 Inactive'}
                </button>
                <button onclick="removeListConnection('${conn.listId}')" style="padding: 4px 8px; font-size: 11px; background: #dc3545; color: white; border: none; border-radius: 3px;">
                  ❌
                </button>
              </div>
            </div>
          `).join('');
        } else {
          // Show single list connection (old format)
          listConnectionsContainer.innerHTML = `
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px; background: white; border: 1px solid #ddd; border-radius: 4px; margin: 5px 0;">
              <span style="font-size: 12px;">${connection.listName || 'Unknown List'}</span>
              <div>
                <span style="color: #28a745; font-size: 11px;">🟢 Active</span>
              </div>
            </div>
          `;
        }
      }
      
      function addListConnection() {
        // Show a modal or form to select another list
        const listSelect = document.getElementById('syncList');
        const selectedListId = listSelect.value;
        const selectedList = workingLists.find(list => list.id === selectedListId);
        
        if (!selectedList) {
          showStatus('Please select a list first', 'error');
          return;
        }
        
        // Get current connection
        const connection = JSON.parse(localStorage.getItem('linkloom-connection'));
        if (!connection.listConnections) {
          connection.listConnections = [];
        }
        
        // Check if list is already connected
        const alreadyConnected = connection.listConnections.find(conn => conn.listId === selectedListId);
        if (alreadyConnected) {
          showStatus(`List "${selectedList.name}" is already connected`, 'error');
          return;
        }
        
        // Add new list connection
        connection.listConnections.push({
          listId: selectedListId,
          listName: selectedList.name,
          isActive: true
        });
        
        // Save updated connection
        localStorage.setItem('linkloom-connection', JSON.stringify(connection));
        
        // Update UI
        updateConnectionDetails();
        populateListConnections();
        showStatus(`List "${selectedList.name}" added successfully`, 'success');
      }
      
      function removeListConnection(listId) {
        const connection = JSON.parse(localStorage.getItem('linkloom-connection'));
        if (!connection.listConnections) return;
        
        // Remove the list connection
        connection.listConnections = connection.listConnections.filter(conn => conn.listId !== listId);
        
        // Save updated connection
        localStorage.setItem('linkloom-connection', JSON.stringify(connection));
        
        // Update UI
        updateConnectionDetails();
        populateListConnections();
        showStatus('List connection removed', 'success');
      }
      
      function toggleListConnection(listId) {
        const connection = JSON.parse(localStorage.getItem('linkloom-connection'));
        if (!connection.listConnections) return;
        
        // Toggle the active state
        const listConn = connection.listConnections.find(conn => conn.listId === listId);
        if (listConn) {
          listConn.isActive = !listConn.isActive;
          
          // Save updated connection
          localStorage.setItem('linkloom-connection', JSON.stringify(connection));
          
          // Update UI
          updateConnectionDetails();
          populateListConnections();
          showStatus(`List "${listConn.listName}" ${listConn.isActive ? 'activated' : 'deactivated'}`, 'success');
        }
      }
