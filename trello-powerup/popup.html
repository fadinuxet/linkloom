<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Connect LinkLoom</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script src="./config.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        color: #333;
        min-height: 100vh;
      }
      
      .container {
        max-width: 300px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      
      .header {
        text-align: center;
        margin-bottom: 16px;
        padding: 16px 14px 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        position: relative;
      }
      

      
      .logo {
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 10px;
        color: white;
        font-size: 18px;
        font-weight: bold;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }
      
      .title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 5px;
        color: white;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }
      
      .subtitle {
        color: rgba(255, 255, 255, 0.9);
        font-size: 12px;
        line-height: 1.3;
        font-weight: 400;
      }
      
      .form-group {
        margin-bottom: 12px;
        padding: 0 14px;
      }
      
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #2d3748;
        font-size: 12px;
        letter-spacing: 0.025em;
      }
      
      .form-group label.required::after {
        content: ' *';
        color: #e53e3e;
        font-weight: 700;
      }
      
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 8px;
        border: 2px solid #e2e8f0;
        border-radius: 6px;
        font-size: 12px;
        transition: all 0.3s ease;
        box-sizing: border-box;
        background: #f8fafc;
        color: #2d3748;
        font-weight: 500;
      }
      
      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        transform: translateY(-1px);
      }
      
      .btn {
        width: 100%;
        padding: 8px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 2px 6px rgba(102, 126, 234, 0.2);
        position: relative;
        overflow: hidden;
      }
      
      .btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
      }
      
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      }
      
      .btn:hover::before {
        left: 100%;
      }
      
      .btn:active {
        transform: translateY(0);
      }
      
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
      }
      
            /* Button container spacing */
      .btn-container {
        padding: 0 14px 14px;
      }
      
      .status {
        padding: 8px;
        border-radius: 6px;
        margin: 10px 14px;
        text-align: center;
        font-weight: 600;
        font-size: 12px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
        border: none;
      }
      


      .status.success {
        background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
        color: #155724;
        border-left: 4px solid #28a745;
      }

      .status.error {
        background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
        color: #721c24;
        border-left: 4px solid #dc3545;
      }

      .status.loading {
        background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
        color: #0c5460;
        border-left: 4px solid #17a2b8;
      }

      .hidden {
        display: none;
      }
      
      /* ========================================
         BEAUTIFUL DARK THEME DESIGN
         ======================================== */
      
      /* Dark theme base */
      #unifiedInterface {
        background: #1A1A1A;
        color: #ffffff;
        border-radius: 12px;
        overflow: hidden;
      }
      
      /* Purple header section */
      .header {
        background: linear-gradient(135deg, #6633CC 0%, #7C3AED 100%);
        padding: 16px 20px;
        text-align: center;
        position: relative;
      }
      
      .header .logo {
        width: 48px;
        height: 48px;
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 12px;
        font-size: 24px;
        font-weight: bold;
        color: white;
      }
      
      .header .title {
        font-size: 24px;
        font-weight: 700;
        color: white;
        margin-bottom: 6px;
      }
      
      .header .subtitle {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 16px;
      }
      
      /* Header action buttons */
      .header-actions {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      
      .header-btn {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        backdrop-filter: blur(10px);
      }
      
      .header-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateY(-1px);
      }
      
      /* Main content area */
      .main-content {
        background: #1A1A1A;
        padding: 16px 20px;
      }
      
      /* Section header */
      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      
      .section-title {
        font-size: 18px;
        font-weight: 700;
        color: white;
      }
      
      .status-indicator {
        font-size: 12px;
        color: #9CA3AF;
        background: #262626;
        padding: 4px 10px;
        border-radius: 16px;
      }
      
      /* List cards */
      .list-card {
        background: #262626;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.2s ease;
        border: 1px solid #404040;
      }
      
      .list-card:hover {
        border-color: #6633CC;
        transform: translateY(-1px);
        box-shadow: 0 4px 15px rgba(102, 51, 204, 0.15);
      }
      
      .list-info {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
      }
      
      .list-icon {
        width: 32px;
        height: 32px;
        background: #404040;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
      }
      
      .list-details h4 {
        font-size: 14px;
        font-weight: 600;
        color: white;
        margin: 0 0 2px 0;
      }
      
      .list-details p {
        font-size: 12px;
        color: #9CA3AF;
        margin: 0;
      }
      
      .list-status {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #9CA3AF;
      }
      
      .status-dot.active {
        background: #10B981;
      }
      
      .status-text {
        font-size: 12px;
        color: #9CA3AF;
      }
      
      .status-text.active {
        color: #10B981;
      }
      
      /* Toggle switch */
      .toggle-switch {
        position: relative;
        width: 48px;
        height: 24px;
        background: #404040;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      
      .toggle-switch.active {
        background: #10B981;
      }
      
      .toggle-switch::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        transition: all 0.3s ease;
      }
      
      .toggle-switch.active::after {
        left: 26px;
      }
      
      /* Bottom sync button */
      .sync-button {
        background: #10B981;
        color: white;
        border: none;
        padding: 16px 24px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 100%;
        margin-top: 24px;
      }
      
      .sync-button:hover {
        background: #059669;
        transform: translateY(-1px);
        box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
      }
      
      /* Settings tab styling */
      .settings-content {
        background: #262626;
        border-radius: 12px;
        padding: 20px;
        margin-top: 16px;
      }
      
      .settings-content h4 {
        color: white;
        margin-bottom: 20px;
        font-size: 18px;
        font-weight: 600;
      }
      
      .form-group label {
        color: #D1D5DB;
        font-weight: 500;
        margin-bottom: 8px;
        display: block;
        font-size: 14px;
      }
      
      .form-group input,
      .form-group select {
        background: #404040;
        border: 1px solid #525252;
        color: white;
        border-radius: 8px;
        padding: 12px 16px;
        width: 100%;
        font-size: 14px;
        transition: border-color 0.2s ease;
      }
      
      .form-group input:focus,
      .form-group select:focus {
        border-color: #6633CC;
        box-shadow: 0 0 0 3px rgba(102, 51, 204, 0.1);
        outline: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Old header removed - using new unified interface instead -->

      <!-- Connection Form -->
      <div id="connectionForm">
        <div class="form-group">
          <label for="linkloomUrl" class="required">LinkLoom URL</label>
          <input 
            type="url" 
            id="linkloomUrl" 
            placeholder="https://yourname.linkloom.com"
            value="https://fadi.linklom.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="syncList" class="required">Sync List</label>
          <select id="syncList" required>
            <option value="">Select a list to sync...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="syncRule" class="required">Sync Rule</label>
          <select id="syncRule" required>
            <option value="latest">Latest cards</option>
            <option value="pinned">Pinned cards only</option>
            <option value="all">All cards</option>
          </select>
        </div>

        <div class="form-group">
          <label for="cardLimit" class="required">Card Limit</label>
          <input 
            type="number" 
            id="cardLimit" 
            min="1" 
            max="50" 
            value="10"
            required
          />
        </div>

        <div class="btn-container">
          <button class="btn" id="connectBtn" onclick="connectToLinkLoom()">
            Connect LinkLoom
          </button>
        </div>
      </div>

      <!-- Status Messages -->
      <div id="status" class="status hidden"></div>

      <!-- Connection Success - Removed, now goes directly to Already Connected view -->

      <!-- Already Connected -->
      <div id="alreadyConnected" class="hidden">
        <div class="status success">
          🔗 Already Connected
        </div>
        <p style="text-align: center; margin: 16px 0; font-size: 14px; color: #666;">
          This board is already connected to LinkLoom!
        </p>
        <div id="connectionDetails" style="text-align: left; background: #f8f9fa; padding: 12px; border-radius: 6px; margin: 12px 14px; border: 1px solid #e9ecef;">
          <p style="margin: 0; color: #666; font-size: 12px;">
            <strong>Connection Details:</strong><br>
            <span id="connectionInfo">Loading...</span>
          </p>
        </div>
        
        <!-- Multiple List Management -->
        <div id="listManagement" style="padding: 0 14px; margin-bottom: 15px;">
          <h4 style="margin: 10px 0; color: #333; font-size: 14px;">📋 List Management</h4>
          <div id="listConnections" style="margin: 10px 0;">
            <!-- List connections will be populated here -->
          </div>
          
          <!-- List Selection for Adding New Lists -->
          <div style="margin: 15px 0; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px solid #e9ecef;">
            <h5 style="margin: 0 0 10px 0; color: #333; font-size: 13px;">➕ Add New List Connection</h5>
            <select id="addListSelect" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; font-size: 12px;">
              <option value="">Select a list to add...</option>
            </select>
            <button class="btn" onclick="addListConnection()" style="width: 100%; background: #17a2b8; font-size: 12px;">
              ➕ Add Selected List
            </button>
          </div>
        </div>
        
        <div style="padding: 0 14px 14px;">
          <button class="btn" onclick="syncAgain()" style="width: 100%; background: #28a745; margin-bottom: 10px;">
            🔄 Sync Now
          </button>
          <button class="btn" onclick="disconnectAndReconnect()" style="width: 100%; background: #dc3545;">
            Disconnect
          </button>
        </div>
      </div>

                    <!-- Beautiful Dark Theme Interface -->
       <div id="unifiedInterface" class="hidden">
         <div class="header">
           <div class="logo">L</div>
           <div class="title">LinkLoom</div>
           <div class="subtitle">Trello Integration</div>
           <div class="header-actions">
             <button class="header-btn" onclick="switchTab('syncLists')">Sync Lists</button>
             <button class="header-btn" onclick="switchTab('settings')">Settings</button>
           </div>
         </div>
 
         <!-- Status display for unified interface -->
         <div id="unifiedStatus" class="status hidden" style="margin: 0 20px 20px 20px;"></div>
 
         <div class="main-content">
           <div id="syncListsContent">
             <div class="section-header">
               <h3 class="section-title">Trello Lists</h3>
               <div style="display: flex; align-items: center; gap: 12px;">
                 <div class="status-indicator" id="statusIndicator">0/0 connected</div>
                 <button class="header-btn" onclick="forceRefreshLists()" style="background: #6633CC; border: none; padding: 6px 12px; font-size: 11px;">
                   🔄 Refresh
                 </button>
               </div>
             </div>
             
             <div id="unifiedListsContainer">
               <!-- Lists will be populated here -->
             </div>
             
             <button class="sync-button" onclick="syncAllActiveLists()">
               🔄 Sync Active Lists
             </button>
           </div>
 
           <div id="settingsContent" class="hidden">
             <div class="settings-content">
               <h4>⚙️ Settings</h4>
               <div class="form-group">
                 <label for="unifiedLinkloomUrl">LinkLoom URL</label>
                 <input 
                   type="url" 
                   id="unifiedLinkloomUrl" 
                   placeholder="https://yourname.linkloom.com"
                   value="https://fadi.linklom.com"
                   required
                 />
               </div>
 
               <div class="form-group">
                 <label for="unifiedSyncRule">Sync Rule</label>
                 <select id="unifiedSyncRule" required>
                   <option value="latest">Latest cards</option>
                   <option value="pinned">Pinned cards only</option>
                   <option value="all">All cards</option>
                 </select>
               </div>
 
               <div class="form-group">
                 <label for="unifiedCardLimit">Card Limit</label>
                 <input 
                   type="number" 
                   id="unifiedCardLimit" 
                   min="1" 
                   max="50" 
                   value="10"
                   required
                 />
               </div>
 
               <button class="sync-button" onclick="saveUnifiedSettings()" style="background: #6633CC;">
                 Save Settings
               </button>
             </div>
           </div>
         </div>
       </div>
    </div>

    <script>
      // Trello API configuration from config file
      console.log('🔧 Loading config:', window.LINKLOOM_CONFIG);
      const TRELLO_API_KEY = window.LINKLOOM_CONFIG?.TRELLO_API_KEY || 'your-actual-trello-api-key-here';
      
      console.log('🔑 Trello API Key loaded:', TRELLO_API_KEY ? 'YES' : 'NO', TRELLO_API_KEY ? TRELLO_API_KEY.substring(0, 10) + '...' : 'NO KEY');
      
      // Check if API key is configured
      if (TRELLO_API_KEY === 'your-actual-trello-api-key-here') {
        console.error('⚠️ Please update your Trello API key in config.js');
      }
      
      let trelloClient;
      let currentBoard;
      let currentList;
      let workingLists = [
        { id: 'todo', name: 'To Do', closed: false },
        { id: 'doing', name: 'Doing', closed: false },
        { id: 'done', name: 'Done', closed: false },
        { id: 'linkloom', name: 'LinkLoom', closed: false },
        { id: 'backlog', name: 'Backlog', closed: false },
        { id: 'in-progress', name: 'In Progress', closed: false }
      ];

      // Initialize when page loads
      document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 DOM loaded, initializing Power-Up...');
        console.log('🔍 Checking localStorage on load:');
        console.log('🔍 linkloom-connection:', localStorage.getItem('linkloom-connection'));
        console.log('🔍 current-trello-board-id:', localStorage.getItem('current-trello-board-id'));
        console.log('🔍 trello-real-data:', localStorage.getItem('trello-real-data'));
        
        // Small delay to ensure localStorage data is available
        setTimeout(() => {
          initializePowerUp();
        }, 100);
      });

      function initializePowerUp() {
        console.log('🔧 Initializing Power-Up...');
        
        // FIRST PRIORITY: Always try to get real Trello data first
        getCurrentBoardId().then(boardId => {
          if (boardId) {
            console.log('🔍 FIRST PRIORITY - Got board ID:', boardId);
            fetchRealListsForBoard(boardId).then(() => {
              // After fetching real lists, check for existing connection
              checkExistingConnection();
            });
          } else {
            console.log('❌ FIRST PRIORITY - No board ID found, using test data');
            checkExistingConnection();
          }
        });
        
        // SECOND PRIORITY: Listen for real Trello data from connector
        window.addEventListener('message', function(event) {
          console.log('📨 Message received:', event.data);
          if (event.data && event.data.type === 'trello-data') {
            console.log('✅ Real Trello data received via postMessage');
            console.log('🔧 Initializing with real Trello data...');
            
            const { boardId, boardName, realLists } = event.data.data;
            console.log('🏢 Real board data received:', { boardId, boardName });
            console.log('📋 Real lists data received:', realLists);
            
            // Initialize with real data
            initializeWithRealData(boardId, boardName, realLists);
          }
        });
        
        // THIRD PRIORITY: Check if we have real Trello data from localStorage
        try {
          const storedData = localStorage.getItem('trello-real-data');
          console.log('🔍 THIRD PRIORITY - Checking trello-real-data:', storedData);
          
          if (storedData) {
            const realData = JSON.parse(storedData);
            const { boardId, boardName, realLists } = realData;
            
            if (boardId && boardName && realLists) {
              console.log('✅ Real Trello data detected from localStorage');
              console.log('🔧 Initializing with real Trello data...');
              
              // Initialize with real data
              initializeWithRealData(boardId, boardName, realLists);
              
              // Clear localStorage after using it
              localStorage.removeItem('trello-real-data');
              return;
            }
          }
        } catch (error) {
          console.log('❌ Error reading localStorage:', error);
        }
        
        // FOURTH PRIORITY: Check URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const boardId = urlParams.get('boardId');
        const boardName = urlParams.get('boardName');
        const realListsParam = urlParams.get('realLists');
        
        if (boardId && boardName && realListsParam) {
          console.log('✅ Real Trello data detected in URL');
          try {
            const realLists = JSON.parse(decodeURIComponent(realListsParam));
            initializeWithRealData(boardId, boardName, realLists);
            return;
          } catch (error) {
            console.error('❌ Error parsing real data:', error);
          }
        }
        
        // LAST RESORT: Load fallback data
        console.log('🔄 No data found, loading fallback data...');
        loadBoardDataWithFallback();
      }
      
            function checkExistingConnection() {
        // Check if we have an existing connection
        const connectionData = localStorage.getItem('linkloom-connection');
        console.log('🔍 Checking existing connection:', connectionData);
        
        if (connectionData) {
          try {
            const connection = JSON.parse(connectionData);
            console.log('✅ EXISTING CONNECTION FOUND! Showing unified interface...');
            
            // Set current board
            currentBoard = { 
              id: connection.boardId, 
              name: connection.boardName || 'Your Trello Board' 
            };
            
            // Show unified interface instead of old separate screens
            showUnifiedInterface();
          } catch (error) {
            console.log('❌ Error parsing connection data:', error);
            showUnifiedInterface();
          }
        } else {
          // No existing connection, show unified interface
          showUnifiedInterface();
        }
      }

      function initializeWithRealData(boardId, boardName, realLists) {
        console.log('🔧 Initializing with real Trello data:', { boardId, boardName, realLists });
        
        // Set current board
        currentBoard = { id: boardId, name: boardName };
        
        // Store real board data
        localStorage.setItem('current-trello-board-id', boardId);
        localStorage.setItem('trello-real-data', JSON.stringify({
          boardId: boardId,
          boardName: boardName,
          realLists: realLists
        }));
        
        // Use real lists
        workingLists = realLists;
        console.log('📋 Real lists loaded:', workingLists);
        
        // Populate list dropdown
        populateListDropdown(workingLists);
        
        // Check for existing connection after loading real data
        checkExistingConnection();
      }
      
      function loadBoardDataWithFallback() {
        console.log('🔄 Loading fallback board data...');
        
        // Set fallback board
        currentBoard = { id: 'working-board', name: 'Your Board' };
        
        // Use fallback lists
        workingLists = [
          { id: 'todo', name: 'To Do', closed: false },
          { id: 'doing', name: 'Doing', closed: false },
          { id: 'done', name: 'Done', closed: false },
          { id: 'linkloom', name: 'LinkLoom', closed: false },
          { id: 'backlog', name: 'Backlog', closed: false },
          { id: 'in-progress', name: 'In Progress', closed: false }
        ];
        
        // Populate list dropdown
        populateListDropdown(workingLists);

      async function syncAgain() {
        // Declare originalText outside try block so it's available in finally
        let originalText = '🔄 Sync Now';
        
        try {
          console.log('🔄 Starting re-sync...');
          
          // Get current connection data
          const connectionData = localStorage.getItem('linkloom-connection');
          if (!connectionData) {
            showStatus('No connection found. Please connect first.', 'error');
            return;
          }
          
          const connection = JSON.parse(connectionData);
          console.log('🔄 Re-syncing with connection:', connection);
          
          // Show loading state
          const syncBtn = document.querySelector('button[onclick="syncAgain()"]');
          if (syncBtn) {
            originalText = syncBtn.innerHTML;
            syncBtn.innerHTML = '🔄 Syncing...';
            syncBtn.disabled = true;
          }
          
          // Sync all active list connections
          let totalCardsSynced = 0;
          let totalListsSynced = 0;
          
          for (const listConnection of connection.listConnections || []) {
            if (listConnection.isActive) {
              console.log(`🔄 Syncing list: ${listConnection.listName} (${listConnection.listId})`);
              
              // Send sync request for this specific list
              const response = await fetch(`${window.LINKLOOM_CONFIG.SUPABASE_URL}/functions/v1/trello-sync-full`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${window.LINKLOOM_CONFIG.SUPABASE_ANON_KEY}`
                },
                body: JSON.stringify({
                  user_id: connection.user_id || 'test-user',
                  board_id: connection.boardId || currentBoard.id,
                  list_id: listConnection.listId,
                  sync_rule: connection.syncRule || 'latest',
                  board_name: connection.boardName || currentBoard.name,
                  list_name: listConnection.listName,
                  linkloom_url: connection.linkloomUrl,
                  card_limit: connection.cardLimit || 10,
                  trello_token: connection.trelloToken,
                  trello_api_key: window.LINKLOOM_CONFIG.TRELLO_API_KEY
                })
              });
              
              if (!response.ok) {
                const errorData = await response.json();
                console.log('🔍 Detailed error response:', errorData);
                
                // Build detailed error message
                let errorMessage = `Sync failed for list ${listConnection.listName}: ${response.status} - ${errorData.error || 'Unknown error'}`;
                
                if (errorData.trello_error) {
                  errorMessage += `\nTrello Error: ${errorData.trello_error}`;
                }
                if (errorData.status) {
                  errorMessage += `\nStatus: ${errorData.status}`;
                }
                if (errorData.list_id) {
                  errorMessage += `\nList ID: ${errorData.list_id}`;
                }
                if (errorData.trello_url) {
                  errorMessage += `\nTrello URL: ${errorData.trello_url}`;
                }
                
                throw new Error(errorMessage);
              }
              
              const result = await response.json();
              console.log(`✅ List ${listConnection.listName} synced:`, result);
              
              totalCardsSynced += result.trello_cards_count || 0;
              totalListsSynced++;
            }
          }
          
          if (totalListsSynced === 0) {
            throw new Error('No active list connections found to sync');
          }
          
          // Show success message for multiple lists
          showStatus(`✅ Re-sync successful! ${totalCardsSynced} cards synced from ${totalListsSynced} lists.`, 'success');
          
          // Update connection details
          updateConnectionDetails();
          
        } catch (error) {
          console.error('❌ Re-sync failed:', error);
          showStatus(`❌ Re-sync failed: ${error.message}`, 'error');
        } finally {
          // Restore button state
          const syncBtn = document.querySelector('button[onclick="syncAgain()"]');
          if (syncBtn) {
            syncBtn.innerHTML = originalText;
            syncBtn.disabled = false;
          } else {
            console.log('⚠️ Sync button not found for restoration');
          }
        }
      }

      async function initiateTrelloOAuth(connectionData) {
        try {
          // Trello OAuth URL - use the Power-Up's domain for callback
          const oauthUrl = `https://trello.com/1/authorize?expiration=never&name=LinkLoom&scope=read&response_type=token&key=${TRELLO_API_KEY}&return_url=${encodeURIComponent('https://dapper-eclair-8ecd0e.netlify.app/oauth-callback.html')}`;
          
          console.log('🔗 OAuth URL:', oauthUrl);
          
          // Open OAuth popup
          const oauthWindow = window.open(oauthUrl, 'trello-oauth', 'width=500,height=600');
          
          if (!oauthWindow) {
            throw new Error('Failed to open OAuth popup. Please allow popups for this site.');
          }
          
          console.log('🪟 OAuth popup opened successfully');
          
          // Listen for OAuth completion
          window.addEventListener('message', async function(event) {
            if (event.data && event.data.type === 'trello-oauth-success') {
              const { token } = event.data;
              
              console.log('🎯 OAuth success - Token received:', token ? 'YES' : 'NO', token ? token.substring(0, 10) + '...' : 'NO TOKEN');
              
              // Store token with connection data
              connectionData.trelloToken = token;
              console.log('🔐 Token stored in connectionData:', connectionData.trelloToken ? 'YES' : 'NO');
              
              localStorage.setItem('linkloom-connection', JSON.stringify(connectionData));
              
              // Close OAuth window
              if (oauthWindow) oauthWindow.close();
              
              // Now send to LinkLoom backend with token
              try {
                console.log('📤 About to send to backend with token:', connectionData.trelloToken ? 'YES' : 'NO');
                await sendToLinkLoom(connectionData);
                showConnectionSuccess();
              } catch (error) {
                console.error('Backend sync failed:', error);
                showStatus('OAuth successful, but backend sync failed. Check your Supabase setup.', 'error');
                setTimeout(() => showConnectionSuccess(), 3000);
              }
            }
          });
          
        } catch (error) {
          console.error('OAuth error:', error);
          showStatus('OAuth failed: ' + error.message, 'error');
        }
      }

            needsUpdate = true;

      function populateAddListDropdown() {
        const addListSelect = document.getElementById('addListSelect');
        if (!addListSelect) return;
        
        // Get current connection to see which lists are already connected
        const connection = JSON.parse(localStorage.getItem('linkloom-connection'));
        const connectedListIds = connection?.listConnections?.map(conn => conn.listId) || [];
        
        // Clear existing options
        addListSelect.innerHTML = '<option value="">Select a list to add...</option>';
        
        // Add available lists (excluding already connected ones)
        workingLists.forEach(list => {
          if (!connectedListIds.includes(list.id)) {
            const option = document.createElement('option');
            option.value = list.id;
            option.textContent = list.name;
            addListSelect.appendChild(option);
          }
        });
        
        // If no lists available, show message
        if (addListSelect.options.length === 1) {
          addListSelect.innerHTML = '<option value="">All lists already connected</option>';
        }
      }
      
      function addListConnection() {
        // Use the new dropdown for adding lists
        const listSelect = document.getElementById('addListSelect');
        const selectedListId = listSelect.value;
        const selectedList = workingLists.find(list => list.id === selectedListId);
        
        if (!selectedListId || !selectedList) {
          showStatus('Please select a list first', 'error');
          return;
        }
        
        // Get current connection
        const connection = JSON.parse(localStorage.getItem('linkloom-connection'));
        if (!connection.listConnections) {
          connection.listConnections = [];
        }
        
        // Check if list is already connected
        const alreadyConnected = connection.listConnections.find(conn => conn.listId === selectedListId);
        if (alreadyConnected) {
          showStatus(`List "${selectedList.name}" is already connected`, 'error');
          return;
        }
        
        // Add new list connection
        connection.listConnections.push({
          listId: selectedListId,
          listName: selectedList.name,
          isActive: true
        });
        
        // Save updated connection
        localStorage.setItem('linkloom-connection', JSON.stringify(connection));
        
        // Update UI
        updateConnectionDetails();
        populateListConnections();
        showStatus(`List "${selectedList.name}" added successfully`, 'success');
      }
      
      function removeListConnection(listId) {
        const connection = JSON.parse(localStorage.getItem('linkloom-connection'));
        if (!connection.listConnections) return;
        
        // Remove the list connection
        connection.listConnections = connection.listConnections.filter(conn => conn.listId !== listId);
        
        // Save updated connection
        localStorage.setItem('linkloom-connection', JSON.stringify(connection));
        
        // Update unified interface
        populateUnifiedListsDisplay();
        showStatus('List connection removed', 'success');
      }
      
      function toggleListConnection(listId) {
        const connection = JSON.parse(localStorage.getItem('linkloom-connection'));
        if (!connection.listConnections) return;
        
        // Toggle the active state
        const listConn = connection.listConnections.find(conn => conn.listId === listId);
        if (listConn) {
          listConn.isActive = !listConn.isActive;
          
          // Save updated connection
          localStorage.setItem('linkloom-connection', JSON.stringify(connection));
          
          // Update unified interface
          populateUnifiedListsDisplay();
          showStatus(`List "${listConn.listName}" ${listConn.isActive ? 'activated' : 'deactivated'}`, 'success');
        }
      }

      // Force refresh lists function
      function forceRefreshLists() {
        console.log('🔄 Force refreshing lists...');
        
        // Try to get current board ID
        const boardId = localStorage.getItem('current-trello-board-id') || '68acf054e933885b63ca3876';
        
        // Try to get Trello token
        const connectionData = localStorage.getItem('linkloom-connection');
        let token = null;
        if (connectionData) {
          try {
            const connection = JSON.parse(connectionData);
            token = connection.trelloToken;
          } catch (error) {
            console.error('❌ Error parsing connection data:', error);
          }
        }
        
        if (token) {
          console.log('🔑 Using stored token to fetch lists...');
          fetch(`https://api.trello.com/1/boards/${boardId}/lists?key=${TRELLO_API_KEY}&token=${token}`)
            .then(response => response.json())
            .then(lists => {
              console.log('✅ Fetched lists from Trello API:', lists);
              workingLists = lists.filter(list => !list.closed);
              populateUnifiedListsDisplay();
            })
            .catch(error => {
              console.error('❌ Error fetching lists:', error);
              // Use fallback lists
              workingLists = [
                { id: 'todo', name: 'To Do', closed: false },
                { id: 'doing', name: 'Doing', closed: false },
                { id: 'done', name: 'Done', closed: false }
              ];
              populateUnifiedListsDisplay();
            });
        } else {
          console.log('⚠️ No token, using fallback lists');
          workingLists = [
            { id: 'todo', name: 'To Do', closed: false },
            { id: 'doing', name: 'Doing', closed: false },
            { id: 'done', name: 'Done', closed: false }
          ];
          populateUnifiedListsDisplay();
        }
      }
      
      function populateUnifiedListsDisplay() {
        const listsContainer = document.getElementById('unifiedListsContainer');
        const statusIndicator = document.getElementById('statusIndicator');
        if (!listsContainer) return;
        
        // Get current connection data
        const connectionData = localStorage.getItem('linkloom-connection');
        let currentConnections = [];
        
        if (connectionData) {
          try {
            const connection = JSON.parse(connectionData);
            currentConnections = connection.listConnections || [];
          } catch (error) {
            console.error('Error parsing connection data:', error);
          }
        }
        
        // Update status indicator
        if (statusIndicator) {
          const activeCount = currentConnections.filter(conn => conn.isActive).length;
          const totalCount = workingLists ? workingLists.length : 0;
          statusIndicator.textContent = `${activeCount}/${totalCount} connected`;
        }
        
        // Clear container
        listsContainer.innerHTML = '';
        
        // Add each list with beautiful card design
        if (workingLists && workingLists.length > 0) {
          workingLists.forEach(list => {
            const isConnected = currentConnections.find(conn => conn.listId === list.id);
            const isActive = isConnected ? isConnected.isActive : false;
            
            const listElement = createUnifiedListElement(list, isConnected, isActive);
            listsContainer.appendChild(listElement);
          });
        } else {
          listsContainer.innerHTML = '<p style="text-align: center; color: #9CA3AF; padding: 40px;">Loading lists...</p>';
        }
      }
      
            function createUnifiedListElement(list, isConnected, isActive) {
        const div = document.createElement('div');
        div.className = 'list-card';
        
        // List info section
        const listInfo = document.createElement('div');
        listInfo.className = 'list-info';
        
        // List icon
        const listIcon = document.createElement('div');
        listIcon.className = 'list-icon';
        listIcon.innerHTML = '📋';
        
        // List details
        const listDetails = document.createElement('div');
        listDetails.className = 'list-details';
        listDetails.innerHTML = `
          <h4>${list.name}</h4>
          <p>${isConnected ? 'Sync your project tasks' : 'Click to connect this list'}</p>
        `;
        
        listInfo.appendChild(listIcon);
        listInfo.appendChild(listDetails);
        
        // Right side status and toggle
        const listStatus = document.createElement('div');
        listStatus.className = 'list-status';
        
        if (isConnected) {
          // Status dot and text
          const statusDot = document.createElement('div');
          statusDot.className = `status-dot ${isActive ? 'active' : ''}`;
          
          const statusText = document.createElement('div');
          statusText.className = `status-text ${isActive ? 'active' : ''}`;
          statusText.textContent = isActive ? 'Active' : 'Inactive';
          
          // Toggle switch
          const toggleSwitch = document.createElement('div');
          toggleSwitch.className = `toggle-switch ${isActive ? 'active' : ''}`;
          toggleSwitch.onclick = () => toggleListConnection(list.id);
          
          listStatus.appendChild(statusDot);
          listStatus.appendChild(statusText);
          listStatus.appendChild(toggleSwitch);
        } else {
          // Connect button for unconnected lists
          const connectBtn = document.createElement('button');
          connectBtn.className = 'header-btn';
          connectBtn.style.cssText = 'background: #6633CC; border: none; padding: 8px 16px; font-size: 12px;';
          connectBtn.textContent = 'Connect';
          connectBtn.onclick = () => addListConnectionFromUnified(list.id);
          
          listStatus.appendChild(connectBtn);
        }
        
        div.appendChild(listInfo);
        div.appendChild(listStatus);
        
        return div;
      }

      function addListConnectionFromUnified(listId) {
        // Add a new list connection from the unified interface
        const selectedList = workingLists.find(list => list.id === listId);
        
        if (!selectedList) {
          showStatus('List not found', 'error');
          return;
        }
        
        // Get current connection
        const connection = JSON.parse(localStorage.getItem('linkloom-connection'));
        if (!connection.listConnections) {
          connection.listConnections = [];
        }
        
        // Check if list is already connected
        const alreadyConnected = connection.listConnections.find(conn => conn.listId === listId);
        if (alreadyConnected) {
          showStatus(`List "${selectedList.name}" is already connected`, 'error');
          return;
        }
        
        // Add new list connection
        connection.listConnections.push({
          listId: listId,
          listName: selectedList.name,
          isActive: true
        });
        
        // Save updated connection
        localStorage.setItem('linkloom-connection', JSON.stringify(connection));
        
        // Update unified interface
        populateUnifiedListsDisplay();
        showStatus(`List "${selectedList.name}" added successfully`, 'success');
