<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LinkLoom Trello Power-Up</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f8f9fa;
        margin: 0;
        text-align: center;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .logo {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        color: white;
        font-size: 32px;
        font-weight: bold;
      }
      .status {
        margin: 20px 0;
        padding: 15px;
        border-radius: 8px;
        font-weight: 500;
      }
      .loading { background: #e3f2fd; color: #1976d2; }
      .success { background: #e8f5e8; color: #2e7d32; }
      .error { background: #ffebee; color: #c62828; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">L</div>
      <h1>LinkLoom Trello Power-Up</h1>
      <p>Connecting your Trello content to your bio page...</p>
      
      <div id="status" class="status loading">
        Loading Power-Up...
      </div>
    </div>

    <script>
      console.log('LinkLoom Power-Up starting...');
      
      // Function to update status
      function updateStatus(message, type) {
        const status = document.getElementById('status');
        status.textContent = message;
        status.className = `status ${type}`;
        console.log('Status:', message);
      }

      // Function to initialize Power-Up
      function initializePowerUp() {
        try {
          console.log('Initializing Power-Up...');
          
          TrelloPowerUp.initialize({
            'board-buttons': function (t, opts) {
              console.log('Board buttons called');
              return [{
                icon: {
                  dark: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHZpZXdCb3g9IjAgMCA2NCA2NCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8cmVjdCB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHJ4PSIxMiIgZmlsbD0iIzY2N2VlYSIvPgogIDx0ZXh0IHg9IjMyIiB5PSI0MCIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjMyIiBmb250LXdlaWdodD0iYm9sZCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiPkw8L3RleHQ+Cjwvc3ZnPgo=',
                  light: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHZpZXdCb3g9IjAgMCA2NCA2NCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8cmVjdCB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHJ4PSIxMiIgZmlsbD0iIzY2N2VlYSIvPgogIDx0ZXh0IHg9IjMyIiB5PSI0MCIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjMyIiBmb250LXdlaWdodD0iYm9sZCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiPkw8L3RleHQ+Cjwvc3ZnPgo='
                },
                text: 'LinkLoom',
                callback: function (t) {
                  console.log('LinkLoom button clicked');
                  return t.popup({
                    title: 'Connect to LinkLoom',
                    url: './popup.html',
                    height: 500
                  });
                }
              }];
            }
          });
          
          updateStatus('✅ Power-Up initialized successfully!', 'success');
          console.log('Power-Up initialization complete');
          
        } catch (error) {
          console.error('Error initializing Power-Up:', error);
          updateStatus('❌ Error initializing: ' + error.message, 'error');
        }
      }

      // Load Trello script
      updateStatus('Loading Trello script...', 'loading');
      
      const script = document.createElement('script');
      script.src = 'https://p.trellocdn.com/power-up.min.js';
      
      script.onload = function() {
        updateStatus('Trello script loaded, initializing...', 'loading');
        console.log('Trello script loaded successfully');
        
        // Wait a moment for script to initialize
        setTimeout(() => {
          if (typeof TrelloPowerUp !== 'undefined') {
            console.log('TrelloPowerUp object found');
            initializePowerUp();
          } else {
            console.error('TrelloPowerUp object not available');
            updateStatus('❌ TrelloPowerUp not available', 'error');
          }
        }, 1000);
      };
      
      script.onerror = function() {
        console.error('Failed to load Trello script');
        updateStatus('❌ Failed to load Trello script', 'error');
      };
      
      document.head.appendChild(script);
    </script>
  </body>
</html>
